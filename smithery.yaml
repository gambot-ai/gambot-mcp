# Smithery configuration for the Gambot WhatsApp MCP server.
# https://smithery.ai/docs
startCommand:
  type: stdio
  configSchema:
    type: object
    # gambotToken is intentionally OPTIONAL. Leave it empty to start the server in
    # token-less ONBOARDING mode (create a brand-new Gambot account from scratch — the
    # token is a RESULT of finishing onboarding). Provide it to unlock the full tool set.
    properties:
      gambotToken:
        type: string
        title: Gambot Token (optional)
        description: >-
          Your Gambot Token (gmbt_…) from Gambot Settings → General. Leave EMPTY if you
          don't have an account yet — the server then runs in onboarding mode (self-serve
          account creation only). Set it to unlock messaging, campaigns, CRM, bots, etc.
      gambotApiBase:
        type: string
        title: API Base URL
        description: Optional override for the API base URL (defaults to https://api.gambot.co.il/api/v1).
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        // No token → the server starts in token-less ONBOARDING mode (by design).
        ...(config.gambotToken ? { GAMBOT_TOKEN: config.gambotToken } : {}),
        ...(config.gambotApiBase ? { GAMBOT_API_BASE: config.gambotApiBase } : {})
      }
    })
